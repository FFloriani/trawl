# Herda o padrão do SearXNG e muda só o necessário para uso local pela API.
use_default_settings: true

general:
  instance_name: "Trawl"

server:
  # Só este PC acessa (porta presa em 127.0.0.1), então o limitador de robôs fica desligado.
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

search:
  safe_search: 0
  # O Trawl lê o formato JSON.
  formats:
    - html
    - json
